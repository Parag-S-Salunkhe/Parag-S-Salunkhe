<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-label="Every task: Ask in plain words, Check read-only first, Act only after a yes, Verify the real result, Save into the runbook, Add a check so it can't slip again. Keeping it current: Every save: quick lint on what changed, Every miss: new guard + a changelog row, Every blocked command: verdict: keep, fix or allow, Weekly: full lint report + Mac security check, Every 14 days: canary tests every access path, Every 30 days: CI inputs vs the last snapshot, Monthly: evals re-run on a smaller model, Always: secrets stay in the keychain.">
