<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-label="Animation: unpacking a tarball that contains a real lib folder. Without --keep-directory-symlink it replaces Ubuntu's /lib -&gt; usr/lib symlink and the next boot panics. With the flag the symlink stays and the files land in usr/lib, so it boots.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a24"/></linearGradient><clipPath id="card"><rect x="0.5" y="0.5" width="839" height="329" rx="16"/></clipPath></defs>
<rect x="0.5" y="0.5" width="839" height="329" rx="16" fill="url(#bg)" stroke="#30363d"/>
<g clip-path="url(#card)"><rect x="0" y="0" width="840" height="4" fill="#d4a72c"/></g>
<text x="36" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d4a72c">THE BUG WORTH TELLING</text>
<text x="36" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">One missing tar flag, one kernel panic</text>
<text x="36" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Ubuntu 22.04 merges /usr: /lib is only a shortcut to usr/lib. Our bundle had a real lib/ folder.</text>
<rect x="36" y="116" width="374" height="196" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="52" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#f85149">tar -xzf golden.tgz -C /target</text>
<text x="52" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">/</text>
<g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.3600;0.4200;0.9600;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="52" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3" xml:space="preserve">├── lib  ──▶  usr/lib</text><text x="286" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">shortcut</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3800;0.4400;0.9500;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="52" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#f85149" xml:space="preserve">├── lib/</text><text x="286" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f85149">a real folder</text></g>
<text x="52" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3" xml:space="preserve">└── usr/lib/</text>
<text x="286" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">every library</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1200;0.1600;0.3600;0.4200;1.0000" dur="10.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="332.4 150;332.4 150;146 182;146 182" keyTimes="0.0000;0.1200;0.3440;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="-62" y="-11" width="123" height="22" rx="11" fill="#0d1117" stroke="#e3b341"/><text x="0" y="4" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#e6edf3">golden.tgz: lib/</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5400;0.9500;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="52" y="246" width="342" height="44" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149"><animate attributeName="fill-opacity" values="0.14;0.14;0.32;0.14;0.32;0.14;0.14" keyTimes="0.0000;0.6000;0.6600;0.7200;0.7800;0.8400;1.0000" dur="10.0s" repeatCount="indefinite"/></rect><text x="223.0" y="273" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#f85149">✗ Kernel panic: init can't find its libraries</text></g>
<rect x="430" y="116" width="374" height="196" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="446" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#3fb950">... --keep-directory-symlink</text>
<text x="446" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">/</text>
<text x="446" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3" xml:space="preserve">├── lib  ──▶  usr/lib</text><text x="680" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">shortcut</text>
<text x="446" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3" xml:space="preserve">└── usr/lib/</text>
<text x="680" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">every library</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3800;0.4400;0.9500;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="550" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#3fb950">+ bundle files</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1200;0.1600;0.3600;0.4200;1.0000" dur="10.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="726.4 150;726.4 150;540 182;540 182" keyTimes="0.0000;0.1200;0.3440;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="-62" y="-11" width="123" height="22" rx="11" fill="#0d1117" stroke="#e3b341"/><text x="0" y="4" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#e6edf3">golden.tgz: lib/</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5400;0.9500;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="446" y="246" width="342" height="44" rx="8" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950"></rect><text x="617.0" y="273" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#3fb950">✓ boots normally</text></g>
</svg>
