<svg xmlns="http://www.w3.org/2000/svg" width="840" height="382" viewBox="0 0 840 382" role="img" aria-label="Animation of what our golden image builds, layer by layer: stock Ubuntu 22.04 from the ISO and answers file, the golden bundle, a first-boot service, one script for static IP and name, then the config agent. About 10 minutes to installed and 45 minutes to a ready host.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><clipPath id="card"><rect x="0.5" y="0.5" width="839" height="381" rx="16"/></clipPath></defs>
<rect x="0.5" y="0.5" width="839" height="381" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
<g clip-path="url(#card)"><rect x="0" y="0" width="840" height="4" fill="#9a6700"/></g>
<text x="36" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9a6700">OUR GOLDEN IMAGE</text>
<text x="36" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2328">Not a cloned disk: a recipe in five layers</text>
<text x="36" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#57606a">Each layer comes from a different place. Only one step needs a person.</text>
<line x1="560" y1="144" x2="560" y2="352" stroke="#d0d7de" stroke-width="2"/>
<line x1="36" y1="357" x2="506" y2="357" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0380;0.0400;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0" keyTimes="0.0000;0.0400;0.1200;1.0000" dur="11.0s" repeatCount="indefinite"/><rect x="36" y="312" width="470" height="40" rx="8" fill="#9a6700" fill-opacity="0.10" stroke="#9a6700" stroke-opacity="0.6"/><text x="52" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Ubuntu 22.04 LTS</text><text x="52" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">stock ISO, installed by the answers file</text><text x="492" y="337" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9a6700">1</text></g></g>
<circle cx="560" cy="332.0" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0780;0.0800;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><circle cx="560" cy="332.0" r="6" fill="#9a6700"/><text x="576" y="336.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">0 min · power on, pick Install</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1780;0.1800;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0" keyTimes="0.0000;0.1800;0.2600;1.0000" dur="11.0s" repeatCount="indefinite"/><rect x="36" y="266" width="470" height="40" rx="8" fill="#9a6700" fill-opacity="0.17" stroke="#9a6700" stroke-opacity="0.6"/><text x="52" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Docker, base tooling, service files</text><text x="52" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">golden bundle + setup script, before reboot</text><text x="492" y="291" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9a6700">2</text></g></g>
<circle cx="560" cy="286.0" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2180;0.2200;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><circle cx="560" cy="286.0" r="6" fill="#9a6700"/><text x="576" y="290.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">~10 min · installed, reboots itself</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3180;0.3200;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0" keyTimes="0.0000;0.3200;0.4000;1.0000" dur="11.0s" repeatCount="indefinite"/><rect x="36" y="220" width="470" height="40" rx="8" fill="#9a6700" fill-opacity="0.24" stroke="#9a6700" stroke-opacity="0.6"/><text x="52" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Settings the installer would undo</text><text x="52" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">one-shot first-boot service</text><text x="492" y="245" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9a6700">3</text></g></g>
<circle cx="560" cy="240.0" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4580;0.4600;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0" keyTimes="0.0000;0.4600;0.5400;1.0000" dur="11.0s" repeatCount="indefinite"/><rect x="36" y="174" width="470" height="40" rx="8" fill="#9a6700" fill-opacity="0.31" stroke="#9a6700" stroke-opacity="0.6"/><text x="52" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Static IP and host name</text><text x="52" y="207" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">one script: the only thing anyone types</text><text x="492" y="199" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9a6700">4</text></g></g>
<circle cx="560" cy="194.0" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4980;0.5000;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><circle cx="560" cy="194.0" r="6" fill="#9a6700"/><text x="576" y="198.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">~25 min · own address, rebooted</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5980;0.6000;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0" keyTimes="0.0000;0.6000;0.6800;1.0000" dur="11.0s" repeatCount="indefinite"/><rect x="36" y="128" width="470" height="40" rx="8" fill="#9a6700" fill-opacity="0.38" stroke="#9a6700" stroke-opacity="0.6"/><text x="52" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Everything else, kept current</text><text x="52" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">the fleet's config agent, every 10 minutes</text><text x="492" y="153" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9a6700">5</text></g></g>
<circle cx="560" cy="148.0" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6380;0.6400;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><circle cx="560" cy="148.0" r="6" fill="#9a6700"/><text x="576" y="152.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">~45 min · ready host</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7980;0.8000;0.9280;0.9300;1.0000" dur="11.0s" repeatCount="indefinite"/><text x="576" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1a7f37">FIRST REAL REBUILD</text></g>
