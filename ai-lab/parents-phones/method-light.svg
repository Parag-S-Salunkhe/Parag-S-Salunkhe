<svg xmlns="http://www.w3.org/2000/svg" width="840" height="262" viewBox="0 0 840 262" role="img" aria-label="The method in six steps: read-only checks over adb, a spyware scan with Amnesty's MVT, every app checked, a yes before removing anything in use, fix by clearing cache never data, and check again a day later.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><clipPath id="card"><rect x="0.5" y="0.5" width="839" height="261" rx="16"/></clipPath></defs>
<rect x="0.5" y="0.5" width="839" height="261" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
<g clip-path="url(#card)"><rect x="0" y="0" width="840" height="4" fill="#0969da"/></g>
<text x="36" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#0969da">THE METHOD</text>
<text x="36" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2328">Six steps, in this order</text>
<text x="36" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#57606a">Each step lights up in turn. Step 4 is the one that matters most.</text>
<rect x="36" y="116" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="116" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1647;0.1667;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="62" cy="145" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="62" y="149.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">1</text>
<text x="86" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Look, don't touch</text>
<text x="86" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">read-only checks over adb</text>
<rect x="296" y="116" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="296" y="116" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1647;0.1667;0.3313;0.3333;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="322" cy="145" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="322" y="149.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">2</text>
<text x="346" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Spyware scan</text>
<text x="346" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Amnesty's MVT on a bug report</text>
<rect x="556" y="116" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="556" y="116" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3313;0.3333;0.4980;0.5000;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="582" cy="145" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="582" y="149.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">3</text>
<text x="606" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Every app checked</text>
<text x="606" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">hashes, trackers, store listing</text>
<rect x="36" y="186" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="186" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4980;0.5000;0.6647;0.6667;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="62" cy="215" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="62" y="219.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">4</text>
<text x="86" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Ask first</text>
<text x="86" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">a yes before removing anything in use</text>
<rect x="296" y="186" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="296" y="186" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6647;0.6667;0.8313;0.8333;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="322" cy="215" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="322" y="219.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">5</text>
<text x="346" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Fix</text>
<text x="346" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Clear cache, never Clear data</text>
<rect x="556" y="186" width="248" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="556" y="186" width="248" height="58" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8313;0.8333;1.0000" dur="10.8s" repeatCount="indefinite"/></rect>
<circle cx="582" cy="215" r="13" fill="#0969da" fill-opacity="0.18" stroke="#0969da"/>
<text x="582" y="219.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0969da">6</text>
<text x="606" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328">Check again</text>
<text x="606" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">a day later</text>
</svg>
